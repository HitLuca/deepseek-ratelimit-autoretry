[project]
name = "freellmapi-retry"
version = "0.1.0"
description = "Transparent retrying proxy for FreeLLMAPI's 'All models exhausted' 429"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
freellmapi-retry = "freellmapi_retry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/freellmapi_retry.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src/freellmapi_retry.py",
    "tests",
    "contrib",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pylint>=3.3.9",
]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[tool.pylint.main]
py-version = "3.9"
# Single-file proxy: the retry loop and SSE relay are inherently branchy.
max-branches = 15
max-nested-blocks = 6
max-module-lines = 1200

[tool.pylint.basic]
# do_GET/do_POST/... are named by BaseHTTPRequestHandler, not by choice.
good-names = ["i", "j", "k", "ex", "db", "_"]
method-rgx = "([a-z_][a-z0-9_]{2,60}|do_[A-Z]+)$"

[tool.pylint.format]
max-line-length = 90

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "consider-using-f-string",     # %-formatting keeps lazy logging and 3.9 parity
    "raise-missing-from",          # CLI errors should not chain internal tracebacks
    "too-few-public-methods",
    "arguments-differ",            # log_message(self, fmt, *args) matches the stdlib
    "attribute-defined-outside-init",  # BaseHTTPRequestHandler sets attrs in setup()
    "duplicate-code",              # the --selftest client mirrors the test client
    "missing-module-docstring",    # test modules are self-describing
]
