[project]
name = "freellmapi-retry"
version = "0.1.0"
description = "Transparent retrying proxy for FreeLLMAPI's 'All models exhausted' 429"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
freellmapi-retry = "freellmapi_retry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/freellmapi_retry.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src/freellmapi_retry.py",
    "tests",
    "contrib",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
